spring.cloud.nacos.config.server-addr=#{cloud}:#{port}
spring.cloud.nacos.config.group=JDGL
spring.cloud.nacos.config.namespace=#{namespace}
#spring.cloud.nacos.config.access-key=nacos
#spring.cloud.nacos.config.secret-key=nacos
spring.cloud.nacos.config.cipher=779daa6faec1a7a4bd7792e1239aec9a

#属性重复时，优先级A>B>C
#A
#nacos会自动寻找1、 #{spring.application.name}.properties 和2、 #{spring.application.name}-#{spring.profiles.active}.properties
#1可配置该应用下的特殊 1、可配置该应用不同环境（开发、测试、生成）等属性
spring.application.name=bjts.shzs
spring.profiles.active = #{profileActive}

#B
spring.cloud.nacos.config.ext-config[0].dataId=app.properties
spring.cloud.nacos.config.ext-config[0].group=${spring.cloud.nacos.config.group}
spring.cloud.nacos.config.ext-config[0].refresh=false


#通用配置
spring.cloud.nacos.config.shared-dataids=common.properties
spring.cloud.nacos.config.refreshable-dataids=common.properties



