#服务注册发现服务器地址
spring.cloud.nacos.discovery.server-addr=#{cloud}:#{port}
spring.cloud.nacos.discovery.namespace=${spring.cloud.nacos.config.namespace}

server.servlet-path=/shzs
server.port=8081

server.tomcat.accesslog.enabled=false
mybatis.mapper-locations=classpath*:mappers/**/*.xml
mybatis.type-aliases-package=com.tl.web.bjts.shzs.dao
mybatis.configuration.cache-enabled=true
mapper.mappers=com.tl.web.bjts.shzs.utils.TlTKMapper

spring.aop.auto=true
spring.aop.proxy-target-class=true

management.security.enabled=false
management.context-path=/app

#禁用spring的session
spring.session.store-type=NONE
shzs.version=#{project.version}

#logging.level.com.tl.web.bjts.shzs.dao=DEBUG
#mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl