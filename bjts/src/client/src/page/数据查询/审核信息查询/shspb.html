<div class="shspb" >
    <div class="pageTabs">
        <div class="pageTitle">
            出口退税核准办理情况查询
        </div>
        <div class="btns" ms-if="@act==1">
            <div class="btn" ms-click="@search(1)">查询</div>
        </div>
        <div class="btns" ms-if="@act==2">
            <div class="btn rt" ms-click="@printForm($event)">打印</div>
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']" >
        <form name="shspb-form">
            <div class="select-wrapper">
                <span class="reset" title="重置查询条件" ms-click="@reset">重置：</span>
                <div class="select-main">
                    <div class="select-item">
                        <label title="退税机关">退税机关</label>
                        <input readonly type="text" ms-duplex="swjgmc" ms-click="@showTree">
                        <ul id="shspbTree" class='ztree treeDiv' style="left: 90px;"></ul>
                    </div>
                    <div class="select-item">
                        <label  title="退税办理年月">退税办理年月</label>
                        <input type="text" class="datepicker date-month" ms-duplex="@searchData.cxtjDTO.ny | change" :on-blur="@filMonth">
                    </div>
                </div>
            </div>
        </form>
        <div class="form" style="padding-top: 54px">
            <table id="shspb-table"></table>
            <div id="shspb-tablePager"></div>
        </div>
    </div>
    <div ms-class="['page',@act==3&&'active']">
        <div class="chartDiv"></div>
    </div>
</div>
