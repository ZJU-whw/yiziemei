<div class="wdzxx" >
    <div class="pageTabs">
        <div class="pageTitle">
            企业上传无电子信息情况查询
        </div>
        <div class="btns" ms-if="@act==1">
            <div class="btn" ms-click="@search(1)">查询</div>
            <div class="btn" ms-click="@exform">导出</div>
            <div class="btn dropdown" ms-on-click="showMenu">
                配置表格▼
                <ul class="dropdown-menu">
                    <li ms-for="(index,item) in @tableOption"><label><input type="checkbox" ms-duplex-checked="item.show" ms-on-click="@setTableOption(item,$event)">{{item.label}}</label></li>
                </ul>
            </div>
        </div>
        <div class="btns" ms-if="@act==2">
            <div class="btn rt" ms-click="@printForm($event)">打印</div>
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']" >
        <div class="control">
            <div class="panel">
                <!--<div class="hyperBtn" style="width: 5%;text-align: center" ms-click="showHyper">-->
                    <!--查询条件<i></i>-->
                <!--</div>-->
                <div style="width: 25%;">
                    <label class="width-s" title="统计时间起">统计时间起</label>
                    <input type="text" class="datepicker date-day width-s" ms-duplex="@searchData.sbrqq | change" :on-blur="@filDate">
                    <span style="margin: 0 5px;">止</span>
                    <input type="text" class="datepicker date-day width-s" ms-duplex="@searchData.sbrqz | change" :on-blur="@filDate">
                </div>
                <div style="position: relative;width: 20%;">
                    <label  class="width-s" title="税务机关">税务机关</label>
                    <input class="width-m" type="text" ms-duplex="searchData.swjgmc" ms-click="showTree">
                    <ul id="wdzxxZtree" class='ztree treeDiv' style="left: 90px;top:100%;"></ul>
                </div>
            </div>
        </div>
        <div class="form" style="padding-top: 50px">
            <table id="wdzxx-table"></table>
            <div id="wdzxx-tablePager"></div>
        </div>
    </div>
    <div ms-class="['page',@act==3&&'active']">
        <div class="chartDiv"></div>
    </div>
</div>
