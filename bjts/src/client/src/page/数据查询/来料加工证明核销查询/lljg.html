<div class="lljg" >
    <div class="pageTabs">
        <div class="pageTitle">
            来料加工证明核销查询
        </div>
        <div class="btns" ms-if="@act==1">
            <div class="btn" ms-click="@search(1)">查询</div>
            <div class="btn" ms-click="@exform">导出</div>
            <div class="btn dropdown" ms-on-click="showMenu">
                配置表格▼
                <ul class="dropdown-menu">
                    <li ms-for="(index,item) in @tableOption"><label><input type="checkbox" ms-duplex-checked="item.show" ms-on-click="@setTableOption(item,$event)">{{item.label}}</label></li>
                </ul>
            </div>
        </div>
        <div class="btns" ms-if="@act==2">
            <div class="btn rt" ms-click="@printForm($event)">打印</div>
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']" >
        <form name="lljg-form">
            <div class="select-wrapper">
                <i class="icon" ms-click="showHyper" title="展开查询条件"></i>
                <div class="select-main">
                    <div class="select-item">
                        <label  title="海关代码">海关代码</label>
                        <input name="hgdm" type="text" ms-duplex="searchData.hgdm">
                    </div>
                    <div class="select-item">
                        <label title="社会信用代码">社会信用代码</label>
                        <input name="shxydm" type="text" ms-duplex="searchData.shxydm">
                    </div>
                    <div class="select-item">
                        <label  title="税务机关">税务机关</label>
                        <input readonly type="text" ms-duplex="swjgmc" ms-click="@showTree">
                        <ul id="lljgZtree" class='ztree treeDiv' style="left: 90px;"></ul>
                    </div>
                </div>
                <div class="select-sub">
                    <div class="select-item">
                        <label  title="申报证明号">申报证明号</label>
                        <input  type="text" ms-duplex="searchData.sbzmno">
                    </div>
                    <div class="select-item">
                        <label  title="企业名称">企业名称</label>
                        <input name="nsrmc"  type="text" ms-duplex="searchData.nsrmc">
                    </div>
                    <div class="select-item">
                        <label  title="来料登记册号">来料登记册号</label>
                        <input  type="text" ms-duplex="searchData.lldjzmno">
                    </div>
                    <div class="select-item">
                        <label  title="已核销标注">已核销标注</label>
                        <select  ms-duplex="@searchData.yhxbz">
                            <option value="">　</option>
                            <option value="0">否</option>
                            <option value="1">是</option>
                        </select>
                    </div>
                    <div class="select-item">
                        <label title="申报年月">申报年月起</label>
                        <div class="select-item-inner">
                            <input type="text" class="datepicker date-month" ms-duplex="@searchData.sbrqq | change" :on-change="@filMonth">
                            <span>止</span>
                            <input type="text" class="datepicker date-month" ms-duplex="@searchData.sbrqz | change" :on-change="@filMonth">
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="form" style="padding-top: 54px">
            <table id="lljg-table"></table>
            <div id="lljg-tablePager"></div>
        </div>
    </div>

    <div ms-class="['page',@act==3&&'active']">
        <div class="chartDiv"></div>
    </div>
</div>
