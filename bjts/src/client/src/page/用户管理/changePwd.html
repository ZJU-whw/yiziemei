<div class="changePwd">
    <div class="pageTabs">
        <div class="pageTitle">系统设置 / 修改密码</div>
    </div>
    <div class="page active">
        <div  style="width:360px;margin: 20px auto;">
            <p style="margin-bottom: 10px"><label class="text-right" style="display:inline-block;width: 140px;"><span class="text-red">*</span>请输入原密码：</label><input type="password" class="width-l" ms-duplex="currentPwd"></p>
            <p style="margin-bottom: 10px"><label class="text-right" style="display:inline-block;width: 140px;"><span class="text-red">*</span>请输入新密码：</label><input type="password" class="width-l" ms-duplex="firstPwd"></p>
            <p style="margin-bottom: 10px"><label class="text-right" style="display:inline-block;width: 140px;"><span class="text-red">*</span>请再次输入新密码：</label><input type="password" class="width-l" ms-duplex="secondPwd"></p>
            <p style="color: #ff0000;line-height: 24px;display: none"><span class="pwd-warn"></span></p>
            <p style="margin-bottom: 10px"><label class="text-right" style="display:inline-block;width: 140px;"></label><span class="btn" style="margin-left: 140px" ms-click="submit">提交</span></p>
        </div>
    </div>
</div>
