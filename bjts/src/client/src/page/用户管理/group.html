<div class="group">
    <div class="pageTabs">
        <div class="pageTitle">系统设置 / 用户组管理</div>
        <div class="btns">
            <input type="text" placeholder="请输入用户组名称" class="lf" ms-duplex="@searchData.name"/>
            <div class="btn" ms-click="search(1,true)">查询</div>
            <div class="btn" ms-click="showModal">新增</div>
        </div>
    </div>
    <div class="page active">
        <div class="form" style="padding-top: 0">
            <table id="group-table"></table>
            <div id="group-pager"></div>
        </div>
        <div class="page-model">
            <div class="model-title">新增用户组</div>
            <div class="model-content">
                <p><label><span class="text-red">*</span>用户组名称：</label><input type="text" class="width-l" ms-duplex="modalData.name"></p>
                <p><label><span class="text-red">*</span>用户组代码：</label><input type="text" class="width-l" ms-duplex="modalData.code"></p>
                <p><label>用户组说明：</label><input type="text" class="width-l" ms-duplex="modalData.remark"></p>
            </div>
            <div class="model-btns">
                <div class="btn" ms-click="submit">确定</div>
                <div class="btn" ms-click="closeModal">取消</div>
            </div>
        </div>
    </div>
</div>
