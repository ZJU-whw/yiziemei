<div class="zxrcjdydhs">
    <div class="pageTabs">
        <div class="pageTitle">
            专项日常监管疑点核实
        </div>
        <div class="btns" ms-if="@act==1">
            <div class="btn" ms-click="@normalSearch()">查询</div>
            <div class="btn" ms-click="@exform">导出</div>
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']">
        <form name="zxrcjdydhs-form">
            <div class="select-wrapper">
                <span class="reset" title="重置查询条件" ms-click="@reset">重置：</span>
                <i class="icon" ms-click="showHyper" title="展开查询条件"></i>
                <div class="select-main">
                    <div class="select-item">
                        <label title="税务机关">税务机关</label>
                        <input readonly type="text" ms-duplex="tsjgmc" ms-click="@showTree">
                        <ul id="fxdyjggltree" class='ztree treeDiv' style="left: 90px;"></ul>
                    </div>
                    <div class="select-item">
                        <label title="专项指标">专项指标</label>
                        <select ms-duplex="@searchData.zbid">
                            <option value="">　</option>
                            <option ms-for="item in @zbidList" ms-attr="{value: item.zbId}">{{item.zbCname}}</option>
                        </select>
                    </div>
                    <div class="select-item">
                        <label title="扫描时间起">扫描时间起</label>
                        <div class="select-item-inner">
                            <input type="text" class="bt-form-control datepicker date-day" :on-blur="@filDate"
                                ms-duplex="@searchData.smrqQ">
                            <span style="margin:0;">止</span>
                            <input type="text" class="bt-form-control datepicker date-day" :on-blur="@filDate"
                                ms-duplex="@searchData.smrqZ">
                        </div>
                    </div>

                </div>
                <div class="select-sub">
                    <div class="select-item">
                        <label title="企业税号">企业税号</label>
                        <input class="width-l" type="text" ms-duplex="searchData.nsrsbh">
                    </div>
                    <div class="select-item">
                        <label title="企业名称">企业名称</label>
                        <input class="width-l" type="text" ms-duplex="searchData.nsrmc">
                    </div>
                    <div class="select-item">
                        <label title="扫描类型">扫描类型</label>
                        <select ms-duplex="@searchData.smlx">
                            <option value="">　</option>
                            <option value="0">自动扫描</option>
                            <option value="1">手动扫描</option>
                        </select>
                    </div>

                </div>
            </div>
        </form>
        <div class="form" style="padding-top: 54px">
            <div class="tab clear" style="margin: 10px;">
                <div class="tab-item" :class="activeIndex == '0' && 'active'" ms-click="changeTab('0')">未核实</div>
                <div class="tab-item" :class="activeIndex == '1' && 'active'" ms-click="changeTab('1')">已核实</div>
            </div>
            <!-- <table id="zxrcjdydhs-table"></table>
          <div id="zxrcjdydhs-tablePager"></div> -->
            <div style="padding-top: 5px;" ms-visible="activeIndex == '0'">
                <table id="zxrcjdydhs-whs-table"></table>
                <div id="zxrcjdydhs-whs-tablePager"></div>
            </div>
            <div style="padding-top: 5px;" ms-visible="activeIndex == '1'">
                <table id="zxrcjdydhs-yhs-table"></table>
                <div id="zxrcjdydhs-yhs-tablePager"></div>
            </div>
        </div>
    </div>
    <!-- 查看 -->
    <div class="page-model add-page-model g-model"
        style="height:522px;width: 700px;margin-left: -350px;top: 50px; margin-top: 0;">
        <div class="model-title">{{@addTitle}}</div>
        <div class="model-content g-form" style="height: 430px;padding: 10px 0;">
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>所属税务机关：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="syjgfw" ms-attr="{disabled: true}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>纳税人识别号：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.nsrsbh" ms-attr="{disabled: true}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>纳税人名称</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.nsrmc" ms-attr="{disabled: true}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>扫描类型：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.smlxZn" ms-attr="{disabled: true}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>扫描日期：</div>
                <div class="g-form-item__content">
                    <input type="text" class="datepicker date-day" :on-blur="@filDate" ms-duplex="@modelData.smrq"
                        ms-attr="{disabled: true}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>专项监管指标名称：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.zbid" ms-attr="{disabled: true}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>指标参数集合：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.zbcs" ms-attr="{disabled: true,title:@modelData.zbcs}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>扫描结果：</div>
                <div class="g-form-item__content">
                    <!-- <input type="text" ms-duplex="modelData.smjg" ms-attr="{disabled: true,title:@modelData.smjg}"> -->
                    <textarea class="g-textarea" ms-duplex="modelData.smjg" ms-attr="{disabled: true,title:@modelData.smjg}"></textarea>
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red">*</span>核实结果类型：</div>
                <div class="g-form-item__content">
                    <select class="g-select" ms-duplex="@modelData.hsjglx" ms-attr="{disabled: @addTitle=='查看'}"
                        style="width: 100%;">
                        <option value="">　</option>
                        <option value="0">未核实</option>
                        <option value="1">已核实</option>
                    </select>
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red">*</span>核实日期：</div>
                <div class="g-form-item__content">
                    <input type="text" class="datepicker date-day" :on-blur="@filDate" ms-duplex="@modelData.hsrq"
                        ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red">*</span>核实人员：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.hsry" ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>核实处理情况：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.hsclqk" ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
        </div>
        <div class="model-btns">
            <div class="btn" ms-click="@saveModel" ms-visible="@addTitle!=='查看'">保存</div>
            <div class="btn" ms-click="@hideModel">退出</div>
        </div>
    </div>
</div>
