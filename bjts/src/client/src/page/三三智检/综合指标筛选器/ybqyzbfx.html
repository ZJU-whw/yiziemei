<div class="ybqyzbfx tableLine" ms-click="hideNsrsbh">
  <div class="pageTabs">
      <div class="pageTitle">
        样本企业分析
      </div>
  </div>
  <div ms-class="['page','active']" >
    <div class="part ybqyzbfx-table">
      <p class="part-title clear">
        <span>样本企业</span>
        <div class="btns clear rt">
          <div class="btn" ms-click="@showImportModel">导入</div>
          <div class="btn" ms-click="@showModel()">添加</div>
          <div class="btn" ms-click="@exform">导出</div>
        </div>
      </p>
      <table id="ybqyzbfx-table"></table>
    </div>
    <div class="clear part">
      <div class="part-item">
        <p class="part-title clear">
          <span>异常指标统计结果</span>
          <div class="btns clear rt">
            <div class="btn" ms-click="@refreshResult()">刷新</div>
            <div class="btn" ms-click="@exformResult()">导出</div>
          </div>
        </p>
        <table id="ybqyzbfx-result-table"></table>
      </div>
      <div class="part-item mzqy">
        <p class="part-title clear ml-10">
          <select ms-duplex="@searchDataMzqy.type">
            <option value="1">样本命中企业</option>
            <option value="2">其他命中企业</option>
          </select>
          <div class="btns clear rt">
            <div class="btn" ms-click="@refreshMzqy()">刷新</div>
            <div class="btn" ms-click="@exformMzqy">导出</div>
          </div>
        </p>
        <table id="ybqyzbfx-mzqy-table"></table>
        <div id="ybqyzbfx-mzqy-tablePager"></div>
      </div>
    </div>
  </div>
  <!-- 新增 -->
  <div class="page-model add-page-model nsrsbh-dropdown" style="height:260px;width: 500px;margin-left: -250px;" >
    <div class="model-title">添加</div>
    <div class="model-content g-form" style="height: 160px;">
      <div class="g-form-item">
        <div class="g-form-item__content nsrsbh-group" style="margin-left:0;">
          <input
            style="border: 2px solid #5ab0ed;"
            name="nsrsbh"
            type="text"
            ms-duplex="@modelData.qysbh"
            data-duplex-changed="inpChangeNsrsbh('modelData')"
            ms-focus="@showNsrsbh"
            ms-keyup="@nsrsbhEnterSearch | enter"
            ms-keydown="@keydown($event, 'ybqyzbfxNrsbhList')"
            placeholder="请输入至少4位税号,支持模糊查询"
            autocomplete="off">
          <div ms-visible="@showNsrsbhList" class="nrsbhList" id="ybqyzbfxNrsbhList">
            <p
              ms-for="(index,item) in @nsrsbhList"
              ms-click="@setNsrsbh(item, 'modelData')"
              ms-attr="{index: index}"
              ms-mouseover="@activeBgIndex = index"
              ms-class="{activeBg: @activeBgIndex == index}"
              ms-css="{width: item.nsrmc.length * 12 + 150 +'px'}">
              {{item.nsrxx}}
            </p>
          </div>
        </div>
      </div>
      <div class="g-form-item">
        <div class="g-form-item_label"><span class="text-red">*</span>企业税号：</div>
        <div class="g-form-item__content">
          <input readonly type="text" ms-duplex="@modelData.qysh">
        </div>
      </div>
      <div class="g-form-item">
        <div class="g-form-item_label">企业名称：</div>
        <div class="g-form-item__content">
          <input readonly type="text" ms-duplex="@modelData.qymc">
        </div>
      </div>
    </div>
    <div class="model-btns">
      <div class="btn" ms-click="saveModel">确定</div>
      <div class="btn" ms-click="hideModel">取消</div>
    </div>
  </div>
  <!-- 导入 -->
  <div class="page-model import-page-model" style="height: 240px; margin-top: -120px; width: 400px; margin-left: -200px;">
    <div class="model-title">
      <span>导入</span>
      <span class="model-close" ms-mousedown="$event.preventDefault()" ms-click="hideImportModel">&times;</span>
    </div>
    <div class="model-content" style="height: 134px;">
      <p>1.请按模板填写数据，再进行导入；</p>
      <p>2.点击下载<a class="btn-import" ms-click='@exformModel'>导入模板</a>。</p>
    </div>
    <div class="model-btns">
      <div class="btn" ms-click="hideImportModel">
        <input id="ybqyzbfxFileupload" type="file" name="file"
          data-url="/sszj/zbfx/import">导入
      </div>
    </div>
  </div>
</div>
