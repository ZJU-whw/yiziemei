<div class="sxxmgl tableLine" >
  <div class="pageTabs">
      <div class="pageTitle">
        筛选项目管理
      </div>
      <div class="btns">
          <div class="btn" ms-click="@search(1)">查询</div>
          <div class="btn" ms-click="@showModel('创建')">创建</div>
      </div>
  </div>
  <div ms-class="['page','active']" >
      <div class="select-wrapper">
          <span class="reset" title="重置查询条件" ms-click="@reset">重置：</span>
          <i class="icon" ms-click="showHyper" title="展开查询条件"></i>
          <div class="select-main">
              <div class="select-item">
                  <label  title="税务机关">税务机关</label>
                  <input readonly type="text" ms-duplex="swjgmc" ms-click="showTree">
                  <ul id="sxxmglTree" class='ztree treeDiv' style="left: 90px;top:100%;"></ul>
              </div>
              <div class="select-item">
                <label title="创建日期">创建日期</label>
                <div class="select-item-inner">
                  <input type="text" class="bt-form-control datepicker date-day" :on-blur="@filDate" ms-duplex="@searchData.crTimeQ">
                  <span style="margin:0;">止</span>
                  <input type="text" class="bt-form-control datepicker date-day" :on-blur="@filDate" ms-duplex="@searchData.crTimeZ">
                </div>
              </div>
              <div class="select-item">
                  <label title="项目名称">项目名称</label>
                  <input type="text" ms-duplex="searchData.xmmc" placeholder="支持模糊查询">
              </div>
          </div>
          <div class="select-sub">
              <div class="select-item">
                  <label title="企业类型">企业类型</label>
                  <select ms-duplex="@searchData.tsjsfsDm">
                      <option value="">　</option>
                      <option value="1">生产</option>
                      <option value="2">外贸</option>
                  </select>
              </div>
              <div class="select-item">
                  <label title="备注说明">备注说明</label>
                  <input type="text" ms-duplex="searchData.note" placeholder="支持模糊查询">
              </div>
          </div>
      </div>
      <div class="form list" style="padding-top: 54px">
          <table id="sxxmgl-table"></table>
          <div id="sxxmgl-tablePager"></div>
      </div>
  </div>
  <!-- 编辑/新增 -->
  <div class="page-model add-page-model" style="height:310px;width: 500px;" >
    <div class="model-title">{{@addTitle}}</div>
    <div class="model-content g-form clear" style="height: 210px;padding: 10px 20px;">
      <div class="g-form-item">
        <div class="g-form-item_label"><span class="text-red">*</span>项目名称：</div>
        <div class="g-form-item__content" style="position: relative;">
          <input type="text" ms-duplex="@modelData.xmmc">
        </div>
      </div>
      <div class="g-form-item">
        <div class="g-form-item_label"><span class="text-red">*</span>企业类型：</div>
        <div class="g-form-item__content">
          <select class="g-select" ms-duplex="@modelData.tsjsfsDm" style="height: 30px;width: 100%;">
            <option value=""></option>
            <option value="1">生产</option>
            <option value="2">外贸</option>
          </select>
        </div>
      </div>
      <div class="g-form-item">
        <div class="g-form-item_label">备注说明：</div>
        <div class="g-form-item__content">
          <textarea class="g-textarea" style="resize: none;height: 70px;" ms-duplex="@modelData.note"></textarea>
        </div>
      </div>
    </div>
    <div class="model-btns">
      <div class="btn" ms-click="@saveModel">确定</div>
      <div class="btn" ms-click="@hideModel">取消</div>
    </div>
  </div>
</div>
