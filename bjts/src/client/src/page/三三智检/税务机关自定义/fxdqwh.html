<div class="fxdqwh zbpzWarp tableLine" >
  <div class="pageTabs">
      <div class="pageTitle">
          风险地区维护
      </div>
      <div class="btns">
          <div class="btn" ms-click="@search(1)">查询</div>
          <div class="btn" ms-click="@showModel('新增')">新增</div>
          <div class="btn" ms-click="@delHandler()">批量注销</div>
          <div class="btn" ms-click="@exform">导出</div>
      </div>
  </div>
  <div ms-class="['page','active']" >
      <div class="select-wrapper">
          <span class="reset" title="重置查询条件" ms-click="@reset">重置：</span>
          <i class="icon" ms-click="showHyper" title="展开查询条件"></i>
          <div class="select-main">
              <div class="select-item">
                  <label  title="税务机关">税务机关</label>
                  <input readonly type="text" ms-duplex="swjgmc" ms-click="showTree">
                  <ul id="fxdqwhSwjgTree" class='ztree treeDiv fxdqwhSwjgTree' style="left: 40%;width: 200px;"></ul>
              </div>
              <div class="select-item">
                  <label title="行政区划">行政区划</label>
                  <input type="text" ms-duplex="searchData.xzqh">
              </div>
              <div class="select-item">
                <label title="有效期">有效期</label>
                <div class="select-item-inner">
                  <input type="text" class="bt-form-control datepicker date-day" :on-blur="@filDate" ms-duplex="@searchData.yxqQ">
                  <span style="margin:0;">止</span>
                  <input type="text" class="bt-form-control datepicker date-day" :on-blur="@filDate" ms-duplex="@searchData.yxqZ">
                </div>
              </div>
          </div>
          <div class="select-sub">
              <div class="select-item">
                <label title="启用标志">启用标志</label>
                <select ms-duplex="@searchData.qybz">
                    <option value="Y">启用</option>
                    <option value="N">注销</option>
                </select>
              </div>
              <div class="select-item">
                <label title="风险描述">风险描述</label>
                <input type="text" ms-duplex="@searchData.fxms" placeholder="支持模糊查询">
              </div>
          </div>
      </div>
      <div class="form" style="padding-top: 54px">
          <table id="fxdqwh-table"></table>
          <div id="fxdqwh-tablePager"></div>
      </div>
  </div>
  <!-- 新增/编辑 -->
  <div class="page-model add-page-model" style="height:370px;width: 500px;margin-left: -250px;" >
    <div class="model-title">{{@addTitle}}</div>
    <div class="model-content g-form" style="height: 270px;">
      <div class="g-form-item">
        <div class="g-form-item_label"><span class="text-red">*</span>行政区划：</div>
        <div class="g-form-item__content">
          <input readonly type="text" ms-duplex="@modelData.xzqhMc" ms-click="showTree" ms-attr="{disabled: @addTitle == '查看'}">
          <ul id="fxdqwhXzqhTree" class='ztree treeDiv fxdqwhXzqhTreeAdd' style="left: 0;width: 278px;"></ul>
        </div>
      </div>
      <div class="g-form-item">
        <div class="g-form-item_label">有效期：</div>
        <div class="g-form-item__content">
          <input type="text" style="width: 134px;" class="bt-form-control datepicker date-day" :on-blur="@filDate" ms-duplex="@modelData.yxqQ" ms-attr="{disabled: @addTitle == '查看'}">
          <span style="margin:0 5px;">止</span>
          <input type="text" style="width: 134px;" class="bt-form-control datepicker date-day" :on-blur="@filDate" ms-duplex="@modelData.yxqZ" ms-attr="{disabled: @addTitle == '查看'}">
        </div>
      </div>
      <div class="g-form-item">
        <div class="g-form-item_label"><span class="text-red">*</span>启用标志：</div>
        <div class="g-form-item__content">
          <select class="g-select" ms-duplex="@modelData.qybz" style="width: 100%;" ms-attr="{disabled: @addTitle == '查看'}">
            <option value="Y">启用</option>
            <option value="N">注销</option>
          </select>
        </div>
      </div>
      <div class="g-form-item">
        <div class="g-form-item_label">风险描述：</div>
        <div class="g-form-item__content" style="height: 90px;">
          <textarea class="g-textarea" ms-duplex="modelData.fxms" style="resize: none;height:100%;" ms-attr="{disabled: @addTitle == '查看'}"></textarea>
        </div>
      </div>
    </div>
    <div class="model-btns">
      <div ms-if="@addTitle != '查看'" class="btn" ms-click="saveModel">保存</div>
      <div class="btn" ms-click="hideModel">取消</div>
    </div>
  </div>
</div>
