    <div class="pageTabs">
        <div class="pageTitle">

                                ms-on-click="@setTableOption(item,$event)">{{item.label}}</label></li>
                </ul>
            </div>
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']">
        <form name="fxdyjggl-form">
            <div class="select-wrapper">
                <span class="reset" title="重置查询条件" ms-click="@reset">重置：</span>
                <i class="icon" ms-click="showHyper" title="展开查询条件"></i>
                <div class="select-main">
                    <div class="select-item">
                        <label title="税务机关">税务机关</label>
                        <input readonly type="text" ms-duplex="tsjgmc" ms-click="@showTree">
                        <ul id="fxdyjggltree" class='ztree treeDiv' style="left: 90px;"></ul>
                    </div>
                    <div class="select-item">
                        <label title="统一社会信用代码">统一社会信用代码</label>
                        <input name="qybs" class="width-l" type="text" ms-duplex="searchData.shxyno">
                    </div>
                    <div class="select-item">
                        <label title="企业名称">企业名称</label>
                        <input class="width-l" type="text" ms-duplex="searchData.nsrmc">
                    </div>
                </div>
                <div class="select-sub">
                    <div class="select-item">
                        <label title="风险企业来源">风险企业来源</label>
                        <select ms-duplex="@searchData.fxly">
                            <option value=""></option>
                            <option ms-for="item in @fxlyList" ms-attr="{value:item.DCODE}">{{item.DNAME}}</option>
                        </select>
                    </div>
                    <div class="select-item">
                        <label title="填报日期">填报日期</label>
                        <div class="select-item-inner">
                            <input type="text" class="datepicker date-month" ms-duplex="@searchData.startTbrq | change"
                                :on-change="@filMonth">
                            <span>止</span>
                            <input type="text" class="datepicker date-month" ms-duplex="@searchData.endTbrq | change"
                                :on-change="@filMonth">
                        </div>
                    </div>
                    <div class="select-item">
                        <label title="所属年月">所属年月</label>
                        <input class="width-l" type="text" ms-duplex="searchData.ssny">
                    </div>
                    <!-- <div class="select-item">

                            <input type="text" class="datepicker date-month" ms-duplex="@searchData.endDate | change"
                                :on-change="@filMonth">
                        </div>
                    </div> -->
                </div>
            </div>
        </form>
        <div class="form" style="padding-top: 54px">
