<div class="spfxckwh">
    <div class="pageTabs">
        <div class="pageTitle">
            商品风险出口规则维护
        </div>
        <div class="btns" ms-if="@act==1">
            <div class="btn" ms-click="@normalSearch()">查询</div>
            <div class="btn" ms-click="@showModel('新增')">新增</div>
            <div class="btn" ms-click="@exform">导出</div>
            <div class="btn dropdown" ms-on-click="showMenu">
                配置表格▼
                <ul class="dropdown-menu">
                    <li ms-for="(index,item) in @tableOption"><label><input type="checkbox"
                                ms-duplex-checked="item.show"
                                ms-on-click="@setTableOption(item,$event)">{{item.label}}</label></li>
                </ul>
            </div>
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']">
        <form name="spfxckwh-form">
            <div class="select-wrapper">
                <span class="reset" title="重置查询条件" ms-click="@reset">重置：</span>
                <i class="icon" ms-click="showHyper" title="展开查询条件"></i>
                <div class="select-main">
                    <div class="select-item">
                        <label title="规则名称">规则名称</label>
                        <input class="width-l" type="text" ms-duplex="searchData.gzmc">
                    </div>
                    <div class="select-item">
                        <label title="适用业务范围">适用业务范围</label>
                        <select ms-duplex="@searchData.fwlx">
                            <option value="">　</option>
                            <option value="1">出口电子信息</option>
                            <option value="2">申报出口明细</option>
                            <option value="3">同时适用</option>
                        </select>
                    </div>
                    <div class="select-item">
                        <label title="商品代码">商品代码</label>
                        <input class="width-l" type="text" ms-duplex="searchData.spdm">
                    </div>
                </div>
                <div class="select-sub">
                    <div class="select-item">
                        <label title="商品名称">商品名称</label>
                        <input class="width-l" type="text" ms-duplex="searchData.spmc">
                    </div>
                </div>
            </div>
        </form>
        <div class="form" style="padding-top: 54px">
            <div class="tab clear" style="margin: 10px;">
                <div class="tab-item" :class="activeIndex == '0' && 'active'" ms-click="changeTab('0')">本级风险商品</div>
                <div class="tab-item" :class="activeIndex == '1' && 'active'" ms-click="changeTab('1')">上级和下级风险商品</div> 
              </div>
            <table id="spfxckwh-table"></table>
            <div id="spfxckwh-tablePager"></div>
        </div>
    </div>
    <!-- 查看 -->
    <div class="page-model add-page-model g-model"
        style="height:522px;width: 700px;margin-left: -350px;top: 50px; margin-top: 0;">
        <div class="model-title">{{@addTitle}}</div>
        <div class="model-content g-form" style="height: 430px;padding: 10px 0;">
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>适用机关范围：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="syjgfw" ms-attr="{disabled: true}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red">*</span>适用业务范围：</div>
                <div class="g-form-item__content">
                    <select class="g-select" ms-duplex="@modelData.gzFwData" ms-attr="{disabled: @addTitle=='查看'}"
                        style="width: 100%;">
                        <option value="">　</option>
                        <option value="1">出口电子信息</option>
                        <option value="2">申报出口明细</option>
                        <option value="3">同时适用</option>
                    </select>
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red">*</span>规则名称：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.gzMc" ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>风险描述：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.gzFxms" ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red">*</span>商品代码：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.gzSpdm" ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>商品名称：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.gzSpmc" ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>规格型号：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.gzGgxh" ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>出口口岸：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.gzCkka" ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>出口国别：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.gzCkgb" ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>货源地：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.gzHyd" ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>单价范围起：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.gzDjq" ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>单价范围止：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.gzDjz" ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>总价范围起：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.gzZjq" ms-attr="{disabled: @addTitle=='查看'}">
                        <!-- <input type="text" class="datepicker date-day" :on-blur="@filDate" ms-duplex="@modelData.gzZjq" ms-attr="{disabled: @addTitle=='查看'}"> -->
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>总价范围止：</div>
                <div class="g-form-item__content">
                    <input type="text" ms-duplex="modelData.gzZjz" ms-attr="{disabled: @addTitle=='查看'}">
                        <!-- <input type="text" class="datepicker date-day" :on-blur="@filDate" ms-duplex="@modelData.gzZjz" ms-attr="{disabled: @addTitle=='查看'}"> -->
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>有效期止：</div>
                <div class="g-form-item__content">
                        <input type="text" class="datepicker date-day" :on-blur="@filDate" ms-duplex="@modelData.gzYxqz" ms-attr="{disabled: @addTitle=='查看'}">
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red"></span>生成短信提醒标志(Y/N)：</div>
                <div class="g-form-item__content">
                    <select class="g-select" ms-duplex="@modelData.gzDxtxbz" ms-attr="{disabled: @addTitle=='查看'}"
                        style="width: 100%;">
                        <option value="">　</option>
                        <option value="Y">是</option>
                        <option value="N">否</option>
                    </select>
                </div>
            </div>
            <div class="g-form-item">
                <div class="g-form-item_label"><span class="text-red">*</span>启用标志(Y/N)：</div>
                <div class="g-form-item__content">
                    <select class="g-select" ms-duplex="@modelData.qybj" ms-attr="{disabled: @addTitle=='查看'}"
                        style="width: 100%;">
                        <option value="">　</option>
                        <option value="Y">是</option>
                        <option value="N">否</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="model-btns">
            <div class="btn" ms-click="@saveModel" ms-visible="@addTitle!=='查看'">保存</div>
            <div class="btn" ms-click="@hideModel">退出</div>
        </div>
    </div>
</div>
