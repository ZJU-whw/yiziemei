<div class="jkmPdFh tableLine" >
  <div class="pageTabs">
      <div class="pageTitle">
        健康码评定（复核）
      </div>
      <div class="btns">
          <div class="btn" ms-click="@search(1)">查询</div>
      </div>
  </div>
  <div ms-class="['page','active']" >
      <div class="select-wrapper">
          <span class="reset" title="重置查询条件" ms-click="@reset">重置：</span>
          <div class="select-main">
              <div class="select-item">
                  <label  title="税务机关">税务机关</label>
                  <input readonly type="text" ms-duplex="swjgmc" ms-click="showTree">
                  <ul id="jkmPdFhswjgtree" class='ztree treeDiv jkmPdFhswjgtree' style="left: 90px;top:100%;"></ul>
              </div>
              <div class="select-item">
                  <label  title="企业标识">企业标识</label>
                  <input  type="text" ms-duplex="@searchData.qybs" placeholder="海关代码/税号/名称，支持模糊匹配">
              </div>
          </div>
      </div>
      <div class="form" style="padding-top: 54px">
          <table id="jkmPdFh-table"></table>
          <div id="jkmPdFh-tablePager"></div>
      </div>
  </div>
   <!-- 健康码复核 -->
   <div class="page-model pd-page-model" style="height:480px;width: 500px;margin-left: -250px;" >
    <div class="model-title">健康码复核</div>
    <div class="model-content g-form" style="height: 380px;">
      <div class="g-form-item">
        <div class="g-form-item_label">纳税人识别号：</div>
        <div class="g-form-item__content">
          <input disabled class="g-input" type="text" ms-duplex="@pdData.nsrsbh">
        </div>
      </div>
      <div class="g-form-item">
        <div class="g-form-item_label">企业名称：</div>
        <div class="g-form-item__content">
          <input disabled class="g-input" type="text" ms-duplex="@pdData.nsrMc">
        </div>
      </div>
      <div class="g-form-item">
        <div class="g-form-item_label">原健康码：</div>
        <div class="g-form-item__content">
          <select disabled class="g-select" ms-duplex="@pdData.jkmY">
            <option value=""></option>
            <option value="1">绿码</option>
            <option value="2">黄码</option>
            <option value="3">红码</option>
          </select>
        </div>
      </div>
      <div class="g-form-item">
        <div class="g-form-item_label">新健康码：</div>
        <div class="g-form-item__content">
          <select disabled style="width: calc(100% - 54px);" class="g-select" ms-duplex="@pdData.jkmN">
            <option value=""></option>
            <option value="1">绿码</option>
            <option value="2">黄码</option>
            <option value="3">红码</option>
          </select>
          <div style="margin-top: 2px;" class="btn rt" ms-click="@updateJkm()">查看</div>
        </div>
      </div>
      <div class="g-form-item">
        <div class="g-form-item_label">评定有效期：</div>
        <div class="g-form-item__content">
          <input disabled type="text" ms-duplex="@pdData.yxq">
        </div>
      </div>
      <div class="g-form-item">
        <div class="g-form-item_label">评定意见：</div>
        <div class="g-form-item__content" style="height: 60px;">
          <textarea disabled class="g-textarea" ms-duplex="pdData.pdyj" style="resize: none;height:100%;"></textarea>
        </div>
      </div>
      <div class="g-form-item">
        <div class="g-form-item_label">复核意见：</div>
        <div class="g-form-item__content" style="height: 60px;">
          <textarea class="g-textarea" ms-duplex="pdData.fhyj" style="resize: none;height:100%;"></textarea>
        </div>
      </div>
    </div>
    <div class="model-btns">
        <div class="btn" ms-click="submit('1')">保存</div>
        <div class="btn" ms-click="submit('2')">通过</div>
        <div class="btn" ms-click="back">退回</div>
        <div class="btn" ms-click="hideModelPd">取消</div>
    </div>
  </div>
  <wbr  ms-widget="[{is: 'updateJkm'},@propsToPager]"/>
</div>
