<div class="hctj-new rcsdhc-tj">
  <div class="pageTabs">
    <div class="pageTitle">
      审单核查情况统计
    </div>
    <div class="btns">
      <div class="btn" ms-click="@search(1)">查询</div>
      <div class="btn" ms-click="@exform">导出</div>
    </div>
  </div>
  <div class="page active">
    <form name="rcsdhc-tj-form">
      <div class="select-wrapper">
        <!-- <span class="reset" title="重置查询条件" ms-click="@reset">重置：</span> -->
        <div class="select-main">
          <div class="select-item">
            <label title="税务机关">税务机关</label>
            <input readonly type="text" class="bt-form-control" ms-duplex="swjgmc" ms-click="@showTree">
            <ul id="rcsdhc-tjTree" class='ztree treeDiv' style="left: 40%;width:200px"></ul>
          </div>
          <div class="select-item">
            <label title="统计日期">统计日期起止</label>
            <div class="select-item-inner">
              <input type="text" class="bt-form-control datepicker date-day" ms-click="@showDatetimepicker($event)" ms-duplex="@searchData.timeStart" readonly>
              -
              <input type="text" class="bt-form-control datepicker date-day" ms-click="@showDatetimepicker($event)" ms-duplex="@searchData.timeEnd" readonly>
            </div>
          </div>
        </div>
      </div>
    </form>
    <div class="form" style="padding-top: 33px">
      <table id="rcsdhc-tj-table"></table>
      <div class="total-num">共 {{totalNum}} 条</div>
    </div>
  </div>
</div>
