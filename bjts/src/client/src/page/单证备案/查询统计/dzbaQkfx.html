<div class="hctj-new dzbaqkfx--tj">
  <div class="pageTabs">
    <div class="pageTitle">
      备案单证数字化管理情况分析
    </div>
    <div class="btns">
      <div class="btn" ms-click="@search()">查询</div>
      <div class="btn" ms-click="@exform">导出</div>
    </div>
  </div>
  <div class="page active">
    <form name="dzbaqkfx--tj-form">
      <div class="select-wrapper">
        <div class="select-main">
          <div class="select-item">
            <label title="税务机关">税务机关</label>
            <input readonly type="text" class="bt-form-control" ms-duplex="swjgmc" ms-click="@showTree">
            <ul id="dzbaqkfx--tjTree" class='ztree treeDiv' style="left: 40%;width:200px"></ul>
          </div>
          <div class="select-item">
            <label title="申报期">申报期</label>
            <div class="select-item-inner">
              <input type="text" class="bt-form-control datepicker date-month sbqq" ms-click="@showDatetimepicker($event)" ms-duplex="@searchData.sbqq" readonly>
              止
              <input type="text" class="bt-form-control datepicker date-month sbqz" ms-click="@showDatetimepicker($event)" ms-duplex="@searchData.sbqz" readonly>
            </div>
          </div>
        </div>
      </div>
    </form>
    <div class="form" style="padding-top: 33px">
      <table id="dzbaqkfx--tj-table"></table>
      <div class="total-num">共 {{totalNum}} 条</div>
    </div>
  </div>
</div>
