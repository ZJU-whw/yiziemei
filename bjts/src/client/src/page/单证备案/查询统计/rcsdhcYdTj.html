<div class="hctj-new rcsdhc-yd-tj">
  <div class="pageTabs">
    <div class="pageTitle">
      审单核查情况(月度)统计
    </div>
    <div class="btns">
      <div class="btn" ms-click="@search(1)">查询</div>
      <div class="btn" ms-click="@exform">导出</div>
    </div>
  </div>
  <div class="page active">
    <form name="rcsdhc-yd-tj-form">
      <div class="select-wrapper" style="padding: 10px 10px 15px 0;">
        <span class="reset" title="重置查询条件" ms-click="@reset">重置：</span>
        <div class="select-main">
          <div class="select-item">
            <label title="税务机关">税务机关</label>
            <input readonly type="text" class="bt-form-control" ms-duplex="swjgmc" ms-click="@showTree">
            <ul id="rcsdhc-yd-tjTree" class='ztree treeDiv' style="left: 40%;width:200px"></ul>
          </div>
          <div class="select-item">
            <label title="统计日期">统计日期</label>
            <div class="select-item-inner">
              <input type="text" class="bt-form-control datepicker date-month" ms-click="@showDatetimepicker($event)" ms-duplex="@searchData.timeStart" readonly>
              止
              <input type="text" class="bt-form-control datepicker date-month" ms-click="@showDatetimepicker($event)" ms-duplex="@searchData.timeEnd" readonly>
            </div>
          </div>
          <div class="select-item">
            <label title="下达人">下达人</label>
            <select class="bt-form-control width-m yd-sj-disabled" ms-duplex="searchData.releaser">
              <option value="">请选择</option>
              <option ms-for="item in releaserList" ms-attr="{value: item.releaser}">{{ item.releaser }}</option>
            </select>
          </div>
          <div class="select-item group">
            <label title="分组条件">分组条件</label>
            <label class="select-group">
              <input type="checkbox" class="yd-group" value="1" ms-duplex="groupChecked">
              按月度分组
            </label>
            <label class="select-group">
              <input type="checkbox" class="yd-group yd-sj-disabled" value="2" ms-duplex="groupChecked">
              按下达人分组
            </label>
          </div>
        </div>
      </div>
    </form>
    <div class="form" style="padding-top: 54px">
      <table id="rcsdhc-yd-tj-table"></table>
    </div>
  </div>
</div>
