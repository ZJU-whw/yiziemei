<div class="bagl" >
  <div class="pageTabs">
      <div class="pageTitle">
        企业单证备案情况查询
      </div>
      <div class="btns">
          <div class="btn" ms-click="@search(1)">查询</div>
          <div class="btn" ms-click="@exform">导出</div>
      </div>
  </div>
  <div ms-class="['page','active']" >
      <form name="bagl-form">
          <div class="select-wrapper">
              <span class="reset" title="重置查询条件" ms-click="@reset">重置：</span>
              <i class="icon" ms-click="showHyper" title="展开查询条件"></i>
              <div class="select-main">
                <div class="select-item">
                    <label title="税务机关">税务机关</label>
                    <input readonly type="text" ms-duplex="swjgmc" ms-click="@showTree">
                    <ul id="baglTree" class='ztree treeDiv' style="left: 40%;width:200px"></ul>
                </div>
                <div class="select-item">
                  <label title="纳税人识别号">纳税人识别号</label>
                  <input name="nsrsbh" type="text" ms-duplex="searchData.nsrsbh">
                </div>
                <div class="select-item">
                  <label  title="企业名称">企业名称</label>
                  <input name="nsrmc"  type="text" ms-duplex="searchData.nsrmc">
                </div>
              </div>
              <div class="select-sub">
                <div class="select-item">
                    <label title="企业海关代码">企业海关代码</label>
                    <input name="qyhgdm" type="text" ms-duplex="searchData.qyhgdm">
                </div>
                <div class="select-item">
                  <label title="备案状态">备案状态</label>
                  <select class="width-m" ms-duplex="searchData.bazt">
                    <option value=""></option>
                    <option ms-for="el in @baztOption" ms-attr="{value: el.value}">{{el.name}}</option>
                  </select>
                </div>
                <div class="select-item">
                  <label  title="是否逾期">是否逾期</label>
                  <select class="width-m" ms-duplex="searchData.sfyq">
                    <option value=""></option>
                    <option value="Y">是</option>
                    <option value="N">否</option>
                  </select>
                </div>
              </div>
              <div class="select-sub">
                <div class="select-item">
                  <label title="退税受理日期">退税受理日期</label>
                  <div class="select-item-inner">
                    <input type="text" class="datepicker date-day" ms-duplex="@searchData.slrqq" ms-click="@showDatetimepicker($event)" readonly>
                    <span>至</span>
                    <input type="text" class="datepicker date-day" ms-duplex="@searchData.slrqz" ms-click="@showDatetimepicker($event)" readonly>
                  </div>
                </div>
                <div class="select-item">
                  <label title="备案日期">备案日期</label>
                  <div class="select-item-inner">
                    <input type="text" class="datepicker date-day" ms-duplex="@searchData.barqq" ms-click="@showDatetimepicker($event)" readonly>
                    <span>至</span>
                    <input type="text" class="datepicker date-day" ms-duplex="@searchData.barqz" ms-click="@showDatetimepicker($event)" readonly>
                  </div>
                </div>
              </div>
          </div>
      </form>
      <div class="form" style="padding-top: 54px">
          <table id="bagl-table"></table>
          <div id="bagl-tablePager"></div>
      </div>
  </div>
</div>
