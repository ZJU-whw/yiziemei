<div class="mgspxxkwh" >
    <div class="pageTabs">
        <div class="pageTitle">
            风险商品名单
        </div>
        <div class="btns" ms-if="@act==1">
            <!--<div class="swjg" style="position: relative" ms-click="showSwjg">-->
                <!--{{swjgMc}}-->
                <!--<ul class='ztree treeDiv2' style="left: 0px;top:100%;"></ul>-->
            <!--</div>-->
            <div class="btn" ms-click="@search(1)">查询</div>
            <div class="btn" ms-click="@newData">新增</div>
            <div class="btn" ms-click="@delData">删除</div>
            <div class="btn" ms-click="@exform">导出</div>
            <div class="btn fileupload">导入
                <input id="mgsp-fileupload" title="" type="file" name="file" data-url="/bjtssw/yj/mgsp/import">
            </div>
            <div class="btn" ms-click="@downMB" title="下载用于导入的excel模板">下载模板</div>
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']" >
        <div class="select-wrapper">
            <span class="reset" title="重置查询条件" ms-click="@reset">重置：</span>
            <div class="select-main">
                <div class="select-item">
                    <label class="width-s" title="商品代码">商品代码</label>
                    <input class="width-m" type="text" ms-duplex="searchData.spdm">
                </div>
                <div class="select-item">
                    <label class="width-s" title="商品名称">商品名称</label>
                    <input class="width-m" type="text" ms-duplex="searchData.spmc">
                </div>
                <div class="select-item">
                    <label class="width-s" title="监控日期">监控日期</label>
                    <input type="text" class="datepicker date-day width-m" ms-duplex="@searchData.jkDate" :on-blur="@filDate">
                </div>
            </div>
        </div>
        <div class="form" style="padding-top: 54px">
            <table id="mgspxxkwh-table"></table>
            <div id="mgspxxkwh-tablePager"></div>
        </div>
    </div>
    <div class="page-model" >
        <div class="model-title">新增</div>
        <div class="model-content">
            <p><label><span class="text-red">*</span>有效标志:</label><input type="radio" style="float: none" value="Y" name="yxbz" ms-duplex="modelData.yxbz">有效 <input type="radio" style="float: none" name="yxbz" value="N" ms-duplex="modelData.yxbz">无效</p>
            <p><label><span class="text-red">*</span>商品代码:</label><input type="text" ms-attr="{'disabled':modelData.yxbz=='N'?true:false}" class="width-l" ms-duplex="modelData.spdm"></p>
            <p><label>商品名称:</label><input type="text" ms-attr="{'disabled':modelData.yxbz=='N'?true:false}" class="width-l" ms-duplex="modelData.spmc"></p>
            <p><label>起始日期:</label><input type="text" ms-attr="{'disabled':modelData.yxbz=='N'?true:false}" class="width-l datepicker date-day" ms-duplex="modelData.qsrq" :on-blur="@filDate"></p>
            <p><label>截止日期:</label><input type="text" ms-attr="{'disabled':modelData.yxbz=='N'?true:false}" class="width-l datepicker date-day" ms-duplex="modelData.jzrq" :on-blur="@filDate"></p>
            <p><label>监控原因:</label><textarea rows="3" ms-attr="{'disabled':modelData.yxbz=='N'?true:false}" class="width-l" ms-duplex="modelData.yyms"></textarea></p>

        </div>
        <div class="model-btns">
            <div class="btn" ms-click="saveModel">保存</div>
            <div class="btn" ms-click="hideModel">取消</div>
        </div>
    </div>
</div>
