<div class="ychdxxkcx" >
    <div class="pageTabs">
        <div class="pageTitle">
            异常函调信息库查询
        </div>
        <div class="btns" ms-if="@act==1">
            <!--<div class="swjg" style="position: relative" ms-click="showSwjg">-->
                <!--{{swjgMc}}-->
                <!--<ul class='ztree treeDiv2' style="left: 0px;top:100%;"></ul>-->
            <!--</div>-->
            <div class="btn" ms-click="@search(1)">查询</div>
            <!--<div class="btn" ms-click="@newData">新增</div>-->
            <!--<div class="btn" ms-click="@delData">删除</div>-->
            <div class="btn" ms-click="@exform">导出</div>
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']" >
        <div class="select-wrapper">
            <span class="reset" title="重置查询条件" ms-click="@reset">重置：</span>
            <div class="select-main">
                <div class="select-item">
                    <label class="width-s" title="供货企业税号">供货企业税号</label>
                    <input class="width-m" type="text" ms-duplex="searchData.nsrsbh">
                </div>
                <div class="select-item">
                    <label class="width-s" title="供货企业名称">供货企业名称</label>
                    <input class="width-m" type="text" ms-duplex="searchData.nsrmc">
                </div>
                <div class="select-item">
                    <label class="width-s" title="复函日期">复函日期</label>
                    <div class="select-item-inner">
                        <input type="text" class="datepicker date-day width-s" ms-duplex="@searchData.fhrqq" :on-blur="@filDate">
                        <span>-</span>
                        <input type="text" class="datepicker date-day width-s" ms-duplex="@searchData.fhrqz" :on-blur="@filDate">
                    </div>
                </div>
            </div>
        </div>
        <div class="form" style="padding-top: 54px">
            <table id="ychdxxkcx-table"></table>
            <div id="ychdxxkcx-tablePager"></div>
        </div>
    </div>
    <div class="page-model" >
        <div class="model-title">新增</div>
        <div class="model-content">
            <p><label>有效标志:</label><input type="radio" style="float: none" value="Y" name="yxbz" ms-duplex="modelData.yxbz">有效 <input type="radio" style="float: none" name="yxbz" value="N" ms-duplex="modelData.yxbz">无效</p>
            <p><label>供货企业税号:</label><input type="text" ms-attr="{'disabled':modelData.yxbz=='N'?true:false}" class="width-l" class="width-l" ms-duplex="modelData.nsrsbh"></p>
            <p><label>企业名称:</label><input type="text" ms-attr="{'disabled':modelData.yxbz=='N'?true:false}" class="width-l" class="width-l" ms-duplex="modelData.nsrmc"></p>
            <p><label>复函编号:</label><input type="text" ms-attr="{'disabled':modelData.yxbz=='N'?true:false}" class="width-l" class="width-l" ms-duplex="modelData.fhbh"></p>
            <p style="position: relative"><label>主管税务机关:</label><input type="text" ms-attr="{'disabled':modelData.yxbz=='N'?true:false}" class="width-l" class="width-l" ms-duplex="modelData.zgswjgmc" ms-click="showTree">
                <ul id="ychdxxkcxTree" class='ztree treeDiv' style="left: 100px;top:100%;"></ul>
            </p>
            <p><label>复函日期:</label><input type="text" ms-attr="{'disabled':modelData.yxbz=='N'?true:false}" class="width-l" class="width-l datepicker date-day" ms-duplex="modelData.fhrq"></p>
            <p><label>复函内容:</label><textarea rows="3" ms-attr="{'disabled':modelData.yxbz=='N'?true:false}" class="width-l" class="width-l" ms-duplex="modelData.fhnr"></textarea></p>
        </div>
        <div class="model-btns">
            <div class="btn" ms-click="saveModel">保存</div>
            <div class="btn" ms-click="hideModel">取消</div>
        </div>
    </div>
</div>
