<div :class="['yjxxfhcx',exClass]" >
    <div class="pageTabs">
        <div class="pageTitle">
            预警信息分户查询
        </div>
        <div class="btns" ms-if="@act==1">
            <!--<div class="swjg" style="position: relative" ms-click="showSwjg">-->
                <!--{{swjgMc}}-->
                <!--<ul class='ztree treeDiv2' style="left: 0px;top:100%;"></ul>-->
            <!--</div>-->
            <div class="btn" ms-click="@search(1)">查询</div>
            <div class="btn" ms-if="pgFlag" ms-click="yjClear">预警清零</div>
            <div class="btn" ms-click="@exform">导出</div>
            <div class="btn dropdown" ms-on-click="showMenu">
                配置表格▼
                <ul class="dropdown-menu">
                    <li ms-for="(index,item) in @tableOption"><label><input type="checkbox" ms-duplex-checked="item.show" ms-on-click="@setTableOption(item,$event)">{{item.label}}</label></li>
                </ul>
            </div>
        </div>
        <div class="btns" ms-if="@act==2">
            <div class="btn rt" ms-click="@printForm($event)">打印</div>
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']"   >
        <div class="select-wrapper">
            <span class="reset" title="重置查询条件" ms-click="@reset">重置：</span>
            <i class="icon" ms-click="showHyper" title="展开查询条件"></i>
            <div class="select-main">
                <div class="select-item">
                    <label class="width-s" title="预警项">预警项</label>
                    <select class="width-m" ms-duplex="searchData.yjcode" ms-on-change="setZbList($event)">
                        <option value=""></option>
                        <option ms-for="item in yjList" ms-attr="{'value':item.yjcode}">{{"("+item.yjcode+")"+item.yjname}}</option>
                    </select>
                </div>
                <div class="select-item">
                    <label class="width-s" title="预警指标">预警指标</label>
                    <select class="width-m" ms-duplex="searchData.zbcode">
                        <option value=""></option>
                        <option ms-for="item in zbList" ms-attr="{'value':item.zbcode}">{{"("+item.zbcode+")"+item.zbname}}</option>
                    </select>
                </div>
                <div class="select-item">
                    <label class="width-s" title="处理标志">处理标志</label>
                    <select class="width-m" ms-duplex="searchData.clFlag">
                        <option value=""> </option>
                        <option value="0">未处理</option>
                        <option value="1">已处理</option>
                    </select>
                </div>
            </div>
            <div class="select-sub">
                <div class="select-item">
                    <label class="width-s" title="预警对象">预警对象</label>
                    <input class="width-m" type="text" ms-duplex="searchData.yjObject">
                </div>
                <div class="select-item">
                    <label  class="width-s" title="备注">备注</label>
                    <input class="width-m" type="text" ms-duplex="searchData.bz">
                </div>
                <div class="select-item">
                    <label class="width-s" title="金额">金额</label>
                    <div class="select-item-inner">
                        <input class="width-s" type="text" ms-duplex="searchData.yjAmtStart | change" ms-on-change="@filNum2($event)">
                        <span>-</span>
                        <input class="width-s" type="text" ms-duplex="searchData.yjAmtEnd | change" ms-on-change="@filNum2($event)">
                    </div>
                </div>
            </div>
        </div>
        <div :class="['fhxx', formData&&formData.scoreTotal>30?'danger':'']" style="margin-top: 54px;">
            <div class="lf" style="width: 85%">
                <div class="fhxxItem" style="width: 25%"><label>纳税人名称：</label><span ms-attr="{title:formData.nsrmc}">{{ formData.nsrmc }}</span></div>
                <div class="fhxxItem" style="width: 25%"><label>海关代码：</label><span ms-attr="{title:formData.qyhgdm}">{{ formData.qyhgdm }}</span></div>
                <div class="fhxxItem" style="width: 25%"><label>退税税务机关：</label><span ms-attr="{title:formData.swjgDm}">{{ formData.swjgDm }}</span></div>
                <div class="fhxxItem" style="width: 25%"><label>办税人：</label><span ms-attr="{title:formData.bsyMc}">{{ formData.bsyMc }}</span></div>
                <div class="fhxxItem" style="width: 25%"><label>纳税人识别号：</label><span ms-attr="{title:formData.nsrsbh}">{{ formData.nsrsbh }}</span></div>
                <div class="fhxxItem" style="width: 25%"><label>退税计算方式：</label><span ms-attr="{title:formData.tsjsfsZh}">{{ formData.tsjsfsZh }}</span></div>
                <div class="fhxxItem" style="width: 25%"><label>分类管理等级：</label><span ms-attr="{title:formData.flgldj}">{{ formData.flgldj }}</span></div>
                <div class="fhxxItem" style="width: 25%"><label>法定代表人：</label><span ms-attr="{title:formData.fddbrmc+'/'+formData.frdhhm}">{{ formData.fddbrmc+'/'+formData.frdhhm }}</span></div>
            </div>
            <div class="rt" style="width: 15%">预警总分：<span ms-attr="{title:formData.scoreTotal}">{{formData.scoreTotal}}</span></div>
        </div>
        <div class="form" style="padding-top: 0">
            <table ms-attr="{id:'yjxxfhcx-table'+exClass}"></table>
            <div ms-attr="{id:'yjxxfhcx-tablePager'+exClass}"></div>
        </div>
    </div>
</div>
