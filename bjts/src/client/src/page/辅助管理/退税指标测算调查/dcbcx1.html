<div class="dcbcx" >
    <div class="pageTabs">
        <div class="pageTitle">
            出口企业退税预测情况查询 <span style="font-size: 0.7em;float: none">金额单位：出口(万美元)、退税(万元)</span>
        </div>
        <div class="btns" ms-if="@act==1">
            <div class="btn" ms-click="@normalSearch()">查询</div>
            <div class="btn" ms-click="@exform">导出</div>
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']" >
        <div class="select-wrapper" style="padding-bottom: 10px;line-height: 1">
            <div class="select-main">
                <div class="select-item" style="width:20%">
                    <label  title="退税机关">退税机关</label>
                    <input readonly type="text" ms-duplex="swjgmc" ms-click="@showTree">
                    <ul id="dcbcxTree" class='ztree treeDiv' style="left: 40%;width:200px"></ul>
                </div>
                <div class="select-item" style="width:25%">
                    <label  title="统计年月">统计年月</label>
                    <div class="select-item-inner">
                        <select  ms-duplex="@searchData.tjnd" style="width: 60px">
                            <option ms-for="item in tjndList" ms-attr="{value:item}">{{item}}</option>
                        </select>
                        <span>年</span>
                        <select  ms-duplex="@searchData.tjyf" style="width: 40px">
                            <option value=""></option>
                            <option value="01">1</option>
                            <option value="02">2</option>
                            <option value="03">3</option>
                            <option value="04">4</option>
                            <option value="05">5</option>
                            <option value="06">6</option>
                            <option value="07">7</option>
                            <option value="08">8</option>
                            <option value="09">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                        <span>月</span>
                    </div>
                </div>
                <div class="select-item" style="width:15%">
                    <label  title="企业标识">企业标识</label>
                    <input type="text" ms-duplex="@searchData.qybs">
                </div>
                <div class="select-item" style="width:20%">
                    <label  title="企业重点标志">企业重点标志</label>
                    <select  ms-duplex="@searchData.zdbz" >
                        <option value=""></option>
                        <option value="1">重点</option>
                        <option value="0">非重点</option>
                    </select>
                </div>
                <div class="select-item" style="width:20%">
                    <label  title="退税计算方法">退税计算方法</label>
                    <select  ms-duplex="@searchData.tsjsfs_dm" >
                        <option value=""></option>
                        <option value="1">免抵退</option>
                        <option value="2">免退税</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="form" style="padding-top: 42px">
            <table id="dcbcx-table"></table>
            <div id="dcbcx-tablePager"></div>
        </div>
    </div>
</div>
