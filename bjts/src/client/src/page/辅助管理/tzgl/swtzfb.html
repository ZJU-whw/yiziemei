<div class="swtzfb tzgl" >
    <div class="pageTabs">
        <div class="pageTitle">
            通知管理 / 税务通知发布管理
        </div>
        <div class="btns" ms-if="@act==1">
            <div class="btn" ms-click="@search(1)">查询</div>
            <div class="btn" ms-click="@add">新增</div>
            <div class="btn" ms-click="@myDelete">删除</div>
            <div class="btn btn-container" ms-click="@toggle">批量导入
                <div class="btn-wrapper">
                    <div class="btn fileupload">选择导入文件<input name="file" type="file"  /></div>
                    <div class="btn" ms-click="loadFile">下载模板文件</div>
                </div>
            </div>
            <div class="btn" ms-click="@publish">发布</div>
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']" >
        <div class="select-wrapper" style="padding-bottom: 10px">
            <div class="select-main" style="line-height: 1">
                <div class="select-item">
                    <label  title="通知类型">通知类型</label>
                    <select ms-duplex="@searchData.notitype" ms-change="handleChange">
                        <option value=""></option>
                        <option value="1">群发</option>
                        <option value="2">定向</option>
                    </select>
                </div>
                <div class="select-item">
                    <label title="标题">标题</label>
                    <input type="text" ms-duplex="searchData.title">
                </div>
                <div class="select-item">
                    <label  title="通知对象">通知对象</label>
                    <input type="text"  disabled ms-if="searchData.notitype == ''"  />
                    <input ms-if="searchData.notitype == '1'" readonly type="text" ms-duplex="objvalMc" ms-click="showTree" ms-attr="{placeholder:@getPH}">
                    <input ms-if="searchData.notitype == '2'" type="text"  ms-duplex="searchData.objval" ms-attr="{placeholder:@getPH}">
                    <ul id="swtzfbZtree" class='ztree treeDiv' style="left: 90px;top:100%;"></ul>
                </div>
            </div>
        </div>
        <div class="form" style="padding-top: 40px">
            <table id="swtzfb-table"></table>
            <div id="swtzfb-tablePager"></div>
        </div>
    </div>
    <div ms-class="['page',@act==3&&'active']">
        <div class="chartDiv"></div>
    </div>
</div>
