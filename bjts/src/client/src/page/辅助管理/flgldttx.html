<div class="flgldttx" >
    <div class="pageTabs">
        <div class="pageTitle">
            分类管理评定指标 / 动态提醒查询
        </div>
        <div class="btns" ms-if="@act==1">
            <div class="btn" ms-click="@search(1)">查询</div>
            <div class="btn" ms-click="@exform">导出</div>
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']" >
        <div class="select-wrapper" style="padding-bottom: 10px">
            <div class="select-main" style="line-height: 1">
                <div class="select-item">
                    <label  title="税务机关">税务机关</label>
                    <input readonly type="text" ms-duplex="swjgmc" ms-click="showTree">
                    <ul id="flgldttxZtree" class='ztree treeDiv' style="left: 90px;top:100%;"></ul>
                </div>
                <div class="select-item">
                    <label  title="所属年月">所属年月</label>
                    <input type="text" class="datepicker date-month" ms-duplex="@searchData.ssny" :on-blur="@filDate">
                </div>
            </div>
        </div>
        <div class="form" style="padding-top: 40px">
            <table id="flgldttx-table"></table>
            <div id="flgldttx-tablePager"></div>
        </div>
    </div>
</div>
