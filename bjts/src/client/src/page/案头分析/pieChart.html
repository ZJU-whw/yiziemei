<div class="pie-chart">
  <div class="chart-container">
    <!-- 图表区域 -->
    <div class="chart-area" style="width: 100%; position: relative;display: flex;flex-wrap: wrap;">
      <div ms-for="el in chartConfigs" style="position: relative;"
        ms-class="{'atfxcol-4':componentName=='tsPieChart','atfxcol-6':componentName!=='tsPieChart','h300':el.data&&el.data.length,'h140':!(el.data&&el.data.length)}">
        <div>
          <div class="atfx-chart-title">{{el.title}}</div>
        </div>
        <div ms-visible="el.data&&el.data.length" ms-attr="{id:el.id}" style="width: 100%; height: 100%;"></div>
        <div ms-visible="!(el.data&&el.data.length)" style="width: 100%; height: 100px;">
          <div class="atfx-nodata">
            暂无数据
          </div>
        </div>
        <span ms-visible="el.data&&el.data.length" class="linktext" ms-click="linkMore(el)"
          ms-attr="{ 'data-type': el.type }" style="position: absolute; top: 10px; right: 10px; z-index: 10;">更多</span>
      </div>
    </div>
  </div>
</div>
