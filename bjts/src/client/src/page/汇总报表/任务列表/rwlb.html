<div class="rwlb" >
    <div class="pageTabs">
        <div class="pageTitle" ms-for="(index,item) in pageTitle">
            <span>{{item}}</span>
            <span ms-if="index!=(pageTitle.length-1)">-</span>
        </div>
    </div>
    <div class="pageTabs" style="top:33px">
        <div style="height:33px;line-height:33px;float: left;">
            <span style="margin: 0 5px">{{"【申报年月】"+searchData.ssny}}</span>
            <span style="margin: 0 5px">{{"【税务机关】"+swjgmc}}</span>
        </div>
        <div class="btns" ms-if="@act==1">
            <div class="lf">
                <label  title="所属年月">所属年月</label>
                <input type="text" class="datepicker date-month" ms-duplex="@searchData.ssny" :on-change="@filMonth">
            </div>
            <div class="btn" ms-click="@search(1)">查询</div>
            <!--<div class="btn" ms-click="@showModel">新增期别</div>-->
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']" >
        <div class="form" style="padding-top: 33px">
            <table id="rwlb-table"></table>
            <div id="rwlb-tablePager"></div>
        </div>
    </div>
    <div class="page-model rwlbModel" style="width: 400px;height: 200px">
        <div class="model-title">新增期别</div>
        <div class="model-content" style="height: auto">
            <p style="text-align: center;">
                <label style="float: none">所属年月：</label>
                <input style="float: none" type="text" class="datepicker date-month" id="rwlbModelIpt" :on-change="@filMonth">
            </p>
        </div>
        <div class="model-btns">
            <div class="btn" ms-click="saveModel">提交</div>
            <div class="btn" ms-click="hideModel">取消</div>
        </div>
    </div>
</div>
