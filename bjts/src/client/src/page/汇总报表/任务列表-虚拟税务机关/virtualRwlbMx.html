<div :class="['virtualRwlbMx',exClass]" >
    <div class="pageTabs">
        <div class="pageTitle" ms-for="(index,item) in pageTitle">
            <span>{{item}}</span>
            <span ms-if="index!=(pageTitle.length-1)">-</span>
        </div>
    </div>
    <div class="pageTabs" style="top:33px;">
        <div style="height:33px;line-height:33px;float: left;">
            <span style="margin: 0 5px">{{"【申报年月】"+searchData.ssny}}</span>
            <span style="margin: 0 5px">{{"【税务机关】"+swjgmc}}</span>
        </div>
        <div class="btns">
            <!--<div class="swjg" style="position: relative" ms-click="showSwjg">-->
            <!--{{swjgMc}}-->
            <!--<ul class='ztree treeDiv2' style="left: 0px;top:100%;"></ul>-->
            <!--</div>-->
            <div class="btn" ms-click="@search(1)">刷新</div>
            <!--<div ms-if="act==1&&TZswitch=='1'" class="btn" ms-click="@bbtj">重新制表</div>-->
            <div class="btn dropdown" ms-on-click="showMenu">
                导出套表▼
                <ul class="dropdown-menu">
                    <li style="padding: 2px;overflow: hidden"><div class="btn" ms-click="@exTable('0')">原始数据</div></li>
                    <li style="padding: 2px;overflow: hidden"><div class="btn" ms-click="@exTable('1')">上报数据</div></li>
                </ul>
            </div>
            <!--<div ms-if="TZswitch=='1'" class="btn" ms-click="@bbcj">报表重建</div>-->
        </div>
    </div>
    <div class="page active"   >
        <div class="form" style="padding-top: 33px">
            <table ms-attr="{id:'virtualRwlbMx-table'+exClass}"></table>
            <div ms-attr="{id:'virtualRwlbMx-tablePager'+exClass}"></div>
        </div>
    </div>
</div>
