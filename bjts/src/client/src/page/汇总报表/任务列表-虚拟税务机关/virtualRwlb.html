<div class="virtualRwlb" >
    <div class="pageTabs">
        <div class="pageTitle" ms-for="(index,item) in pageTitle">
            <span>{{item}}</span>
            <span ms-if="index!=(pageTitle.length-1)">-</span>
        </div>
    </div>
    <div class="pageTabs" style="top:33px">
        <!--<div style="height:33px;line-height:33px;float: left;">-->
            <!--<span style="margin: 0 5px">{{"【申报年月】"+searchData.ssny}}</span>-->
            <!--<span style="margin: 0 5px">{{"【税务机关】"+swjgmc}}</span>-->
        <!--</div>-->
        <div class="btns" ms-if="@act==1">
            <div class="lf">
                <label  title="所属年月">所属年月</label>
                <input class="width-m" type="text" class="datepicker date-month" ms-duplex="@searchData.ssny" :on-change="@filMonth">
            </div>
            <div class="lf">
                <label  title="虚拟单位">虚拟单位</label>
                <select class="width-m" ms-duplex="@searchData.swjgdm" >
                    <option value="">请选择</option>
                    <option ms-for="item in virtualList" ms-attr="{value:item.virSwjgdm}">{{item.virName}}</option>
                </select>
            </div>
            <div class="btn" ms-click="@search(1)">查询</div>
            <div class="btn" ms-click="@createQb">创建</div>
        </div>
    </div>
    <div ms-class="['page',@act==1&&'active']" >
        <div class="form" style="padding-top: 33px">
            <table id="virtualRwlb-table"></table>
            <div id="virtualRwlb-tablePager"></div>
        </div>
    </div>
</div>
