<div class="ckjgfs" >
    <div class="pageTabs">
        <div class="pageTitle">
            出口监管方式情况统计表
        </div>
        <div class="btns">
            <div class="btn" ms-click="@search(1)">查询</div>
            <div class="btn" ms-click="@exform">导出</div>
            <div class="btn" ms-click="@changeTab(3)" ms-if="@act==1">统计图</div>
            <div class="btn" ms-click="@changeTab(1)" ms-if="@act==3">统计表</div>
        </div>
    </div>
    <div class="page active" >
        <div class="select-wrapper" style="padding-bottom: 10px;line-height: 1">
            <div class="select-main">
                <div class="select-item">
                    <label  title="退税机关">退税机关</label>
                    <input readonly type="text" ms-duplex="@searchData.swjgMc" ms-click="@showTree">
                    <ul id="ckjgfsTree" class='ztree treeDiv' style="left: 40%;width:200px"></ul>
                </div>
                <div class="select-item">
                    <label title="企业类型">企业类型</label>
                    <input readonly ms-attr="{value:@searchData.qylxMc}" ms-click="showSelect" />
                    <div class="select-container">
                        <label ms-change="@selectChange()" class="select-label"><input class="select-option" type="checkbox" ms-duplex="@searchData.qylx | change" value="1"/>生产企业</label>
                        <label ms-change="@selectChange()" class="select-label"><input class="select-option" type="checkbox" ms-duplex="@searchData.qylx | change" value="2"/>外贸企业</label>
                        <label ms-change="@selectChange()" class="select-label"><input class="select-option" type="checkbox" ms-duplex="@searchData.qylx | change" value="3"/>外综服企业</label>
                    </div>
                </div>
                <div class="select-item">
                    <label  title="出口时间">出口时间起</label>
                    <div class="select-item-inner">
                        <input type="text" class="datepicker date-day" ms-duplex="@searchData.cksjStart"  :on-blur="@filDate">
                        <span>止</span>
                        <input type="text" class="datepicker date-day" ms-duplex="@searchData.cksjEnd"  :on-blur="@filDate">
                    </div>
                </div>
            </div>
            <div class="select-sub" style="display: block">
                <div class="select-item">
                    <label title="企业代码">企业代码</label>
                    <input type="text" ms-duplex="@searchData.qyhgdm" >
                </div>
                <div class="select-item">
                    <label title="出口贸易国">出口贸易国</label>
                    <input readonly type="text" ms-duplex="@ckmygMc" ms-click="@showTree">
                    <ul id="ckjgfsTree2" class='ztree treeDiv' style="left: 40%;width:200px"></ul>
                </div>
            </div>
        </div>
        <div class="form" style="padding-top: 64px" ms-visible="@act==1">
            <table id="ckjgfs-table"></table>
            <div id="ckjgfs-tablePager"></div>
        </div>
        <div class="form" style="padding-top: 64px" ms-visible="@act==3">
            <div id="ckjgfs-chart" style="height:100%"></div>
        </div>
    </div>


</div>
