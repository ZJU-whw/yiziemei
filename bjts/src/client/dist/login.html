<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="static/image/favicon.ico" type="image/x-icon">
    <title>便捷退税（税务端）</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <script src="static/js/jquery.min.js"></script>
    <script src="static/js/jquery.artDialog.min.js"></script>
    <script src="static/js/artDialog.plugins.min.js"></script>
    <script src="static/js/ajax.js"></script>
    <script src="static/js/tools.js?v=1.0.1"></script>
    <script src="static/js/crypto/aes.js"></script>
    <script src="static/js/crypto/cryptoUtils.js"></script>
    <link rel="stylesheet" href="static/css/default.css">

    <style>
        html,body,h1,h2,h3,h4,h5,h6,p,ul,ol,li{
            margin: 0;
            padding: 0;
            list-style: none;
            font-family: "微软雅黑", "sans-serif";
            color: #666666;
        }
        html,body {
            width: 100%;
            height: 100%;
        }
        /** {*/
            /*box-sizing: border-box;*/
            /*webkit-box-sizing: border-box;*/
            /*-moz-box-sizing: border-box;*/
        /*}*/
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 20px 20px 90px;
            line-height: 66px;
            background: url("static/image/logo-sj.png") 20px center no-repeat;
            box-sizing: border-box;
        }
        .header .title {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }
        .header .sub-title {
            font-size: 18px;
            font-weight: 400;
            margin-left: 10px;
            color: #fff;
        }
        .main {
            width: 100%;
            height: 100%;
            background: #f0faff;
        }
        .main img {
            width: 100%;
            height: 100%;
        }
        .footer p {
            text-align: center;
            height: 30px;
            line-height: 30px;
            color: #6fc2fe;
        }
        .login-wrapper {
            position: absolute;
            width: 450px;
            height: 300px;
            top: 0;
            left: 0;
            right:0;
            bottom: 0;
            margin: auto;
            border-radius: 4px;
            box-shadow: #a3fff3 0 0 5px;
            background: #fff;
            padding:  20px 40px;
            box-sizing: border-box;
        }
        .login-title {
            font-size: 18px;
            text-align: center;
            color: #1d82d8;
        }
        .input-wrapper {
            position: relative;
            width: 332px;
            margin: 10px auto;
        }
        .input-wrapper .user-icon,.password-icon {
            position: absolute;
            top: 8px;
            left: 6px;
            width: 16px;
            height: 19px;
        }
        .user-icon{
            background: url("static/image/admin.png") center center no-repeat;
        }
        .password-icon{
            background: url("static/image/key.png") center center no-repeat;
        }
        .login-input{
            position:relative;
            display: block;
            width: 300px;
            height: 34px;
            padding-left: 30px;
            font-size: 14px;
            line-height: 1.42857143;
            color: #555;
            background-color: #fff;
            background-image: none;
            border: 1px solid #ccc;
            border-radius: 4px;
            -webkit-box-shadow: inset 0 1px 1px rgba(0,0,0,.075);
            box-shadow: inset 0 1px 1px rgba(0,0,0,.075);
            -webkit-transition: border-color ease-in-out .15s,-webkit-box-shadow ease-in-out .15s;
            -o-transition: border-color ease-in-out .15s,box-shadow ease-in-out .15s;
            transition: border-color ease-in-out .15s,box-shadow ease-in-out .15s;
            -moz-user-select: none;
            -webkit-user-select: none;
            user-select: none;
            -o-user-select:none;
            -ms-user-select:none;
        }
        .login-btn {
            display: block;
            width: 332px;
            height: 38px;
            line-height: 38px;
            margin: 40px auto 0;
            color: #fff;
            font-size: 16px;
            background: #75c4eb;
            border: 1px solid #75c4eb;
            border-radius: 4px;
            -moz-user-select: none;
            -webkit-user-select: none;
            user-select: none;
            -o-user-select:none;
            -ms-user-select:none;
        }
        .tip {
            width: 332px;
            margin: 0 auto;
            color: #ff0000;
            font-size: 12px;
            display: none;
        }
        .login-btn:hover {
            background: #FFC332;
            cursor: pointer;
            border-color: #FFC332;
        }
        .model{
            display: none;
            width: 100%;
            height: 100%;
            background: url(static/image/bg-modal.png) repeat;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 300;
        }
        .loading{
            display: none;
            position: absolute;
            width: 64px;
            height: 64px;
            top: 50%;
            left: 50%;
            margin-top: -32px;
            margin-left: -32px;
            z-index: 360;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <span class="title">互联网+便捷退税系统</span><span class="sub-title">税务端</span>
    </div>
    <div class="main">
        <img id="bg-image" src="static/image/header.png" alt="">
        <div class="login-wrapper">
            <h3 class="login-title">用户登录</h3>
            <div class="input-wrapper">
                <input id="username" class="login-input username" type="text" placeholder="请输入用户名"/>
                <i class="user-icon"></i>
            </div>
            <div class="input-wrapper">
                <input id="password" class="login-input password" type="password" placeholder="请输入密码"/>
                <i class="password-icon"></i>
            </div>
            <div class="tip">
                请输入正确的账号与密码!
            </div>
            <button class="login-btn" onclick="login()">登录</button>
        </div>
    </div>
    <div class="loading">
        <img src="static/image/loading2.gif" width="64" height="64"/>
    </div>
    <div class="model"></div>
</div>
<script>

    window.onload=function(){
        var el = document.getElementById("bg-image");
        el.src = "./static/image/header.png";
        autoLogin();
        $('#password').keydown(function(e){
            if(e.which==13){
                login();
            }
        });
    }

    /**
     * 登录
     */
    function login(){
        var params = new Object();
        var loginName = $('#username').val();
        params["loginName"] = encodeAesString(loginName);
        var psssWord = $('#password').val();
        //采用aes的方式进行加密
        params["password"] = encodeAesString(psssWord);
        if(!psssWord||!loginName){
            $('.tip').show();
            var time=setTimeout(function(){
                $('.tip').hide();
                clearTimeout(time);
                time=null;
            },5000)
            return ;
        }
        ajax("POST","/auth/login",params).done(function(res){
            if(res.code=='0'){
                window.location.href="./index.html"+ window.location.hash;
            }else{
                $(".tip").text(res.msg)
                $('.tip').show();
                var time=setTimeout(function(){
                    $('.tip').hide();
                    $(".tip").text("请输入正确的账号与密码！")
                    clearTimeout(time);
                    time=null;
                },5000)
            }
        }).fail(function(err){
            $(".tip").text(err)
            $('.tip').show();
            var time=setTimeout(function(){
                $('.tip').hide();
                $(".tip").text("请输入正确的账号与密码！")
                clearTimeout(time);
                time=null;
            },5000)
        })
    }

    // token 登录
    function autoLogin(){
        var loginName = tools.GetQueryString('loginName');
        if(!loginName){
            $.post('/auth/userInfo',{},function(res) {
                if (res.code == '0') {
                    window.location.href="./index.html";
                }
            })
        } else{
            // 执行登录
            $('.login-wrapper').hide();
            $('.loading').show();
            $('.model').show();
            var params = {
                loginName: loginName,
            }
            ajax('POST', '/auth/login/token/get', params).done(function(res){
                $('.loading').hide();
                $('.model').hide();
                if(res.code=='0'){
                    var token = res.data;
                    var tokenParams = {
                        loginName: loginName,
                        token: token,
                    }
                    $('.loading').show();
                    ajax('POST', '/auth/login/token', tokenParams).done(function(result){
                        $('.loading').hide();
                        $('.model').hide();
                        if(result.code=='0'){
                            window.location.href="./index.html" + window.location.hash;
                        } else{
                            tools.info(result.msg);
                            $('.login-wrapper').show();
                        }
                    })
                } else{
                    tools.info(res.msg);
                    $('.login-wrapper').show();
                }
            })
        }
    }
</script>
</body>
</html>
