<body ms-controller="app">
<div class="header clear" ms-class="[hideHeader&& 'hideHeader']">
    <div class="lf">
        <h1 class="lf">互联网+便捷退税系统</h1><span class="sub-title">税务端</span>
    </div>
    <div class="rt">
        <div class="top rt">
            {{user.swjgMc}}
        </div>
        <div class="btm rt">
            <span>欢迎，</span>
            <span class="menu-parent" ms-attr="{title:@user.czrymc}" ms-if="@user.czrymc">
                 {{@userName()}}
            </span>
            <span ms-if="!@user.czrymc">
                 <!--<a ms-click="@showLogin">登录</a>-->
                <a href="login.html">请登录</a>
            </span>
            <span>|</span>
            <span class="exit" ms-click="@logout">
                    退出
            </span>
        </div>

    </div>
</div>
<div class="menu" ms-class="[hideHeader&& 'hideHeadMenu']">
    <div class="content">
        <ul>
            <li class="menu-item" ms-click="@activeTab(0)"><div><i class="icon icon-home" title="首页"></i><span>首页</span></div></li>
            <li ms-for="(index,el) in @menus" class="menu-item" ms-class="[el.hidden&& 'hidden']">
                <div ms-click="@toggleMenu($event,el)" :class="[(el.children&&el.children.length>0? 'hasCd':'')]"><i ms-class="['icon',el.icon]" ms-attr="{title:el.title}"></i><span>{{el.title}}</span></div>
                <ul style="display: none;">
                    <li ms-for="(k,item) in el.children"   :class="[item.hidden && 'hidden',(item.children&&item.children.length>0? 'hasCd2':'')]" ms-click="item.component?@addTab(item):@doOther(item.act)">
                        {{item.title}}
                        <ul :class="['popMenu',item.popClass]" ms-if="item.children&&item.children.length>0">
                            <li ms-for="ii in item.children" class="menu-subItem" ms-class="[ii.hidden&& 'hidden',(ii.children&&ii.children.length>0? 'hasCd3':'')]" ms-click="ii.component?@addTab(ii):@doOther(ii.act)">
                                {{ii.title}}
                                <ul :class="['subMenu',ii.popClass]" ms-if="ii.children&&ii.children.length>0">
                                    <li ms-for="subItem in ii.children"  ms-class="[subItem.hidden&& 'hidden']" ms-click="subItem.component?@addTab(subItem):@doOther(subItem.act)">
                                        {{subItem.title}}
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
    <div class="open-menu">
        菜<br>单
    </div>
</div>

<div class="main" ms-class="[hideHeader&& 'hideHeadMain']">
    <div class="content">
        <div class="tabs">
            <ul>
                <li ms-for="(index,el) in @tabs" class="tab" >
                    <span ms-click="@activeTab(index, true)" :class="[@tabs.length>8? 'mini':'']" ms-attr="{title:el.tip}">{{el.title}}</span>
                    <span class="close" ms-if="el.canClose" ms-click="@delTab(index)">  </span>
                </li>
            </ul>
        </div>
        <div ms-for="(index,el) in @tabs" class="work" :visible="el.isActive">
            <wbr ms-widget="el"/>
        </div>
    </div>
</div>
<div id="dialog"></div>
<div id="loading">
    <img src="./static/image/loading2.gif" width="64" height="64"/>
</div>
<div class="model"></div>
<iframe id="hiddenframe" name="hiddenframe" style="width: 0px;height: 0px;display: none"></iframe>

<!-- 进度条-批量立项 -->
<div class="lxgl-progress-loading">
  <div class="lxgl-progress" style="display: none;">
      <div class="header-progress">
          正在执行批量立项，该操作耗时较长，请勿中断操作，耐心等待....
      </div>
      <hr style="margin-bottom: 50px;" />
      <div class="progress">
          <div class="progress-bar progress-bar-striped active" role="progressbar" aria-valuemin="0" aria-valuemax="100" ms-css="{width: pllxProgress+'%'}" style="min-width: 5em;">
              {{pllxProgress+'%'}}
          </div>
      </div>
  </div>
</div>
<!-- 全局PDF预览组件 -->
<wbr ms-widget="[{is:'pdfViewer'}, {pdfContainerId: 'global-pdf', pdfResultsId: 'global-results'}]" />
<wbr ms-widget="[{is:'multiPdfViewer'}, {pdfContainerId: 'global-multi-pdf'}]" />
</body>
</html>
