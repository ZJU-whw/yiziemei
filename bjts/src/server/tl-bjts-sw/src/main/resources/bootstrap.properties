#nacos 服务配置信息
spring.cloud.nacos.config.server-addr=#{cloud}:#{port}
spring.cloud.nacos.config.group=SWGL_GROUP
spring.cloud.nacos.config.namespace=#{namespace}
#spring.cloud.nacos.config.access-key=nacos
#spring.cloud.nacos.config.secret-key=nacos
spring.cloud.nacos.config.cipher=719dac6fafj7uf17h7a4bd7792e9aec9d

#属性重复时，优先级A>B>C
#A
#nacos会自动寻找1、 #{spring.application.name}.properties 和2、 #{spring.application.name}-#{spring.profiles.active}.properties
#1可配置该应用下的特殊 1、可配置该应用不同环境（开发、测试、生成）等属性
spring.application.name=bjts.swgl.bbfw
spring.profiles.active = #{profileActive}

#B
spring.cloud.nacos.config.extension-configs[0].dataId=app.properties
spring.cloud.nacos.config.extension-configs[0].group=${spring.cloud.nacos.config.group}
spring.cloud.nacos.config.extension-configs[0].refresh=true
#C
#通用配置
spring.cloud.nacos.config.shared-configs[0].dataId=common.properties
spring.cloud.nacos.config.shared-configs[0].refresh=true


spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true

logging.file.path=/home/tonlan/logs




